# Comprehensive sweep on 2000 samples - optimized for speed
# Focus on promising parameters from initial sweep

# Test set (full 2000 samples)
test_set_path: "data/test_torques_2000.h5"

# Fixed parameters - optimized for speed
seed: 228
trajectory_length: 1000
num_diffusion_steps: 50  # Fast DDIM
sampler: "ddim"
context_fraction: 0.5
use_ema: false

# Stage 1: Skip - we know 1.0 is best
stage1:
  guidance_scale: [1.0]

# Stage 2: Focused grid based on best results (adam method only)
# Previous best: adam, steps=20, lr=0.005, after=40 → 74.78%
stage2:
  guidance_method: ["adam"]  # adam_integration was worse
  guidance_steps: [10, 15, 20, 25]
  guidance_lr: [0.003, 0.005, 0.007, 0.01]
  guidance_after_steps: [35, 40, 45]  # 70-90% through 50 steps
  chunk_length: [20]  # Not used for adam, but needed
  lambda_init: [1.0]  # Doesn't affect much
