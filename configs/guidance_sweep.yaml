# Hyperparameter sweep configuration for guidance tuning
# Two-stage approach:
#   Stage 1: Find best CFG guidance_scale (no energy guidance)
#   Stage 2: Fix best guidance_scale, sweep energy-based guidance configs

# Test set
test_set_path: "data/test_torques_2000.h5"

# Fixed parameters
seed: 228
trajectory_length: 1000
num_diffusion_steps: 200
sampler: "ddim"
context_fraction: 0.5
use_ema: false

# Stage 1: Find best CFG guidance_scale (no energy guidance)
stage1:
  guidance_scale: [1.0, 1.1, 1.2, 1.3, 1.5, 2.0]

# Stage 2: Fix best guidance_scale, sweep energy guidance configs
stage2:
  guidance_method: ["adam", "adam_integration"]
  guidance_steps: [10, 20, 50]
  guidance_lr: [0.001, 0.002, 0.01]
  guidance_after_steps: [100, 150, 175]
  chunk_length: [15, 30, 50]  # only used for adam_integration
  lambda_init: [0.5, 1.0, 2.0]
